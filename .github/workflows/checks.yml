name: Windows checks
on:
  push:
  pull_request:
jobs:
  unit-and-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/spektralab/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:preferences
      - run: npm ci --prefix vendor/spektralab/desktop --no-audit --no-fund
      - run: npm run build:editor

